version: 2.1

orbs:
  node: circleci/node@5.1.0

node-image: &node-image
  image: cimg/node:20.9.0
  auth:
    username: $DOCKERHUB_USERNAME
    password: $DOCKERHUB_ACCESS_TOKEN

workflows:
  version: 2
  workflow:
    jobs:
      - build:
          context: npm-readonly
      - publish:
          context: npm-trusted-publish
          requires:
            - build
          filters:
            branches:
              only:
                - main
  # TEMPORARY (ON-405): inspect why npm rejects this repo's OIDC token. Delete with the branch.
  oidc-debug:
    jobs:
      - oidc-debug:
          context: npm-trusted-publish
          filters:
            branches:
              only:
                - on-405-oidc-debug

commands:
  bootstrap:
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: yarn-berry
          with-cache: true
          include-branch-in-cache-key: false

jobs:
  build:
    docker:
      - <<: *node-image
    working_directory: ~/project
    steps:
      - bootstrap
      - run: yarn build
      - run: yarn test --passWithNoTests

  publish:
    docker:
      - <<: *node-image
    working_directory: ~/project
    steps:
      - bootstrap
      - run: yarn build
      - run: ./bump.sh package.json
      - run: |
          export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud":"npm:registry.npmjs.org"}')
          yarn npm publish

  # TEMPORARY (ON-405): prints the OIDC token's header and claims (never the token itself)
  # and npm's response to the token exchange (with any returned token removed).
  oidc-debug:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: Inspect OIDC token claims and npm token exchange
          command: |
            set -uo pipefail
            echo "== circleci run oidc get --help"
            circleci run oidc get --help 2>&1 | head -40 || true
            TOKEN=$(circleci run oidc get --claims '{"aud":"npm:registry.npmjs.org"}')
            decode() { local p; p=$(cut -d. -f"$2" \<<<"$1" | tr '_-' '/+'); while [ $(( ${#p} % 4 )) -ne 0 ]; do p="$p="; done; base64 -d \<<<"$p"; }
            echo "== token header"; decode "$TOKEN" 1 | jq .
            echo "== token claims"; decode "$TOKEN" 2 | jq 'del(.jti)'
            echo "== npm token exchange for @homebound/graphql-id-linter, per token version"
            for flags in "--claims {\"aud\":\"npm:registry.npmjs.org\"}" "--aud npm:registry.npmjs.org" "--aud npm:registry.npmjs.org --v1" "--aud npm:registry.npmjs.org --v2" "--aud npm:registry.npmjs.org --v3"; do
              T=$(circleci run oidc get $flags 2>/dev/null) || { echo "[$flags] could not get a token"; continue; }
              sub=$(decode "$T" 2 | jq -r '.sub')
              code=$(curl -sS -o /tmp/exchange.json -w '%{http_code}' -X POST -H "Authorization: Bearer $T" \
                "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/%40homebound%2Fgraphql-id-linter")
              echo "[$flags] HTTP $code $(jq -c 'del(.token)' /tmp/exchange.json 2>/dev/null)"
              echo "    sub: $sub"
              rm -f /tmp/exchange.json
            done
